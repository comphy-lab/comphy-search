name: Update Search Database

on:
  schedule:
    # Run on the 1st and 15th at 03:13 UTC
    - cron: '13 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install beautifulsoup4 PyYAML
      - name: Generate public search index
        run: python update-database.py
      - uses: actions/upload-artifact@v4
        with:
          name: generated-search-index
          path: search_db.json
          if-no-files-found: error
          retention-days: 1

  publish:
    # This runner never clones or processes the index's input repos.
    needs: generate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: generated-search-index
          path: ${{ runner.temp }}/search-index
      - name: Stage validated index
        env:
          INDEX_FILE: ${{ runner.temp }}/search-index/search_db.json
        run: |
          test -f "$INDEX_FILE" && test ! -L "$INDEX_FILE"
          python -m json.tool "$INDEX_FILE" >/dev/null
          cp -- "$INDEX_FILE" search_db.json
          git add -- search_db.json
      - name: Create repository-scoped publishing token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: comphy-search
      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_BOT_USER_ID: ${{ secrets.APP_BOT_USER_ID }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
        run: |
          if git diff --cached --quiet -- search_db.json; then exit 0; fi
          git -c user.name='comphy-search-updater[bot]' \
            -c user.email="${APP_BOT_USER_ID}+comphy-search-updater[bot]@users.noreply.github.com" \
            commit -m 'Update search database' -- search_db.json
          git push origin HEAD:refs/heads/main
